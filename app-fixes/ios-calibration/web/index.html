<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catholic Compass: a completely free Catholic Bible learning adventure and parish finder.">
  <meta name="theme-color" content="#101b2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Catholic Compass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Use the iPhone safe viewport until the Flutter web engine is upgraded to 3.50+. -->
  <!-- This keeps navigation buttons outside the Dynamic Island on installed PWAs. -->
  <style>html, body { background-color: #101b2e; }</style>
  <title>Catholic Compass</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // This worker only caches this app's own resources. Never cache remote parish
    // directories or off-site links; the app handles the parish JSON separately.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .catch((error) => console.info('Offline support unavailable:', error));
      });
    }
  </script>
</body>
</html>
